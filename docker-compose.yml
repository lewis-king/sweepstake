services:
  postgres:
    image: postgres:16-alpine
    container_name: wc-sweepstake-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sweepstake
      POSTGRES_PASSWORD: sweepstake2026
      POSTGRES_DB: worldcup_sweepstake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweepstake"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wc-sweepstake-storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: sweepstake-admin
      MINIO_ROOT_PASSWORD: sweepstake-admin-2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./minio-init:/root/.minio/
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: wc-sweepstake-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set sweepstake http://minio:9000 sweepstake-admin sweepstake-admin-2026;
      mc mb sweepstake/countries/videos --ignore-existing;
      mc mb sweepstake/countries/audio --ignore-existing;
      mc mb sweepstake/countries/flags --ignore-existing;
      mc anonymous set public sweepstake/countries/videos;
      mc anonymous set public sweepstake/countries/audio;
      mc anonymous set public sweepstake/countries/flags;
      echo 'MinIO buckets created and set to public';
      exit 0;
      "
    restart: "no"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: wc-sweepstake-network
    driver: bridge

